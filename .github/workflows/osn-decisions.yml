name: OSN invites and decisions sync

# Copies council documents newly published on os-nessebar.eu to the OSN site:
# the invitation to each session and the decisions it took. For each kind it
# compares the council's listing with what OSN already holds, prints every
# newer page to PDF and uploads it.
#
# It runs twice a day because an invitation is published only 1-8 days before
# its session and is useless afterwards. Most runs find nothing new and upload
# nothing.
#
# Needs three repository secrets: OSN_API_URL (e.g. https://host, no trailing
# slash), OSN_USERNAME, OSN_PASSWORD. A manual run defaults to a dry run: the
# PDFs land in the run's artifacts and nothing is uploaded.
on:
  schedule:
    - cron: "0 5,16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only render the PDFs (see the run's artifacts); upload nothing"
        type: boolean
        default: true
      limit:
        description: "Send at most this many of each kind, oldest first (0 = all)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  # Two overlapping runs would both see the same item as new and upload it twice.
  group: osn-decisions-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium

      - name: Sync new invites and decisions
        env:
          OSN_API_URL: ${{ secrets.OSN_API_URL }}
          OSN_USERNAME: ${{ secrets.OSN_USERNAME }}
          OSN_PASSWORD: ${{ secrets.OSN_PASSWORD }}
        run: python -m nessebar_budget.osn_sync ${{ inputs.dry_run && '--dry-run' || '' }} --limit ${{ inputs.limit || 0 }}

      - name: Keep the rendered PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osn-pdfs
          path: data/cache/osn_sync
          if-no-files-found: ignore
